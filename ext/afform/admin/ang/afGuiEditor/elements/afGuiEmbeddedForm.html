<div class="af-gui-bar">
  <div class="form-inline">
    <span ng-if="$ctrl.isUnchosen()">{{ $ctrl.getFormType() === 'search' ? ts('Search Form') : ts('Submission Form') }}</span>
    <span ng-if="!$ctrl.isUnchosen()">{{ $ctrl.getTitle() }}</span>
    <div class="btn-group pull-right" af-gui-menu>
      <button type="button" class="btn btn-default btn-xs dropdown-toggle af-gui-add-element-button" data-toggle="dropdown" title="{{:: ts('Configure') }}">
        <span><i class="crm-i fa-gear" role="img" aria-hidden="true"></i></span>
      </button>
      <ul class="dropdown-menu" ng-if="menu.open">
        <li ng-if="!$ctrl.isUnchosen()">
          <a ng-href="{{ $ctrl.getEditUrl() }}" target="_blank">
            <i class="crm-i fa-pencil" role="img" aria-hidden="true"></i> {{:: ts('Edit this form') }}
          </a>
        </li>
        <li role="separator" class="divider" ng-if="!$ctrl.isUnchosen()"></li>
        <li>
          <a href ng-click="$ctrl.deleteThis()">
            <span class="text-danger"><i class="crm-i fa-trash" role="img" aria-hidden="true"></i> {{:: ts('Remove') }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
<div class="af-gui-embedded-form-body" ng-if="$ctrl.isUnchosen()">
  <input class="form-control" crm-autocomplete="'Afform'" crm-autocomplete-params="$ctrl.getAutocompleteParams()" auto-open="true" placeholder="{{:: ts('Choose a form...') }}" ng-model="$ctrl.chooseForm" ng-model-options="{getterSetter: true}">
</div>
<div class="af-gui-embedded-form-body" ng-if="!$ctrl.isUnchosen()">
  {{:: ts('This form is managed separately.') }}
</div>
